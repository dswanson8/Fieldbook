<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Field Book</title>
  <link rel="stylesheet" type="text/css" href="style.min.css">
  <!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
  <style>
    body,
    input,
    button {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif !important;
      font-feature-settings: "tnum" !important;
      /* enable tabular numbers */
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap head">
      <div class="meta">
        <input id="jobTitle" placeholder="Job Title" autocomplete="off">
        <input id="jobDate" type="date">
      </div>
    </div>
  </header>

  <main class="wrap" id="app">
    <div class="card">
      <div class="toolbar">
        <button type="button" id="newSetupBtn" class="primary">+ New Setup</button>
        <div class="addBtn">
          <button type="button" id="addBsBtn">+ Add BS</button>
          <button type="button" id="addFsBtn">+ Add FS</button>
        </div>
        <div class="seg wide" title="HI aggregator">
          <input type="radio" name="agg" id="aggMedian" checked> <label for="aggMedian">Median HI</label>
          <input type="radio" name="agg" id="aggMean"> <label for="aggMean">Mean HI</label>
        </div>
        <button type="button" id="lockToggle" class="ghost wide" title="Lock/unlock current setup">🔒 Lock</button>
      </div>
    </div>

    <div class="chips" id="setupTabs"></div>

    <!-- Shows only when active setup > 0 -->
    <div id="existingBsBar" class="hidden" style="margin-bottom:10px;">
      <button type="button" id="addExistingBsBtn" class="chip">+ Add Existing BS</button>
    </div>

    <div class="card">
      <table id="grid">
        <colgroup>
          <col class="small">
          <col class="small">
          <col class="small">
          <col class="small">
          <col class="small">
          <col class="small">
        </colgroup>
        <thead>
          <tr>
            <th>STA</th>
            <th>BS</th>
            <th>HI</th>
            <th>FS</th>
            <th>ELEV</th>
            <th>GPS</th>
          </tr>
        </thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>

    <!-- Summary (filled by app.js) -->
    <div class="card summary-card">
      <div id="summary"></div>
    </div>
  </main>
  <!-- Bottom action bar (IDs unchanged; app.js wires these by ID) -->
  <nav class="bottom-nav" aria-label="Actions">
    <button type="button" id="exportAllBtn" class="nav-btn" title="Export All (PDF/Print)" aria-label="Export All (PDF/Print)">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6"/><path d="m9 14 3 3 3-3"/></svg>
      <span class="nav-label">Export</span>
    </button>
    <button type="button" id="resetBtn" class="nav-btn nav-btn--danger" title="Reset (clears everything)">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      <span class="nav-label">Reset</span>
    </button>
    <button type="button" id="toolsBtn" class="nav-btn" title="Slope tools">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="m4 16 6-6 4 4 6-7"/><path d="M15 7h5v5"/></svg>
      <span class="nav-label">Slope</span>
    </button>
    <button type="button" id="gradeSpotsBtn" class="nav-btn" title="Grade Sheet">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/><path d="M4 15h16"/><path d="M10 4v16"/></svg>
      <span class="nav-label">Grade Sheet</span>
    </button>
  </nav>

  <!-- Tools Flyout (bottom sheet) -->
  <div id="toolsSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" id="toolsBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-label="Slope tools">
      <div class="sheet-header">
        <button type="button" id="toolsClose" class="ghost" aria-label="Close">✕</button>
      </div>

      <!-- Slope Checker. All IDs unchanged; app.js reads/writes them by ID. -->
      <div class="tool-card sc-card">
        <div class="sc-head">
          <svg class="sc-head-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19h18L3 7z"/><path d="M15.5 19a4 4 0 0 1 .7-2.6"/></svg>
          <div>
            <div class="sc-title">Slope Checker</div>
            <div class="sc-sub">Check design vs. as-built slope between two points.</div>
          </div>
        </div>
        <!-- Setup buttons: built by app.js -->
        <div id="scSetsBar" class="chips"></div>
        <div class="sc-grid">
          <section class="sc-panel" aria-label="Start station">
            <div class="sc-panel-head"><svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Start Station</span></div>
            <input id="scStartSta" placeholder="Station (opt.)" aria-label="Start station" inputmode="text" autocomplete="off">
            <div class="sc-field">
              <input id="scDStart" placeholder="Design Elev (m)" aria-label="Design elevation at start" inputmode="decimal" autocomplete="off">
              <button type="button" id="scDStartPick" class="sc-pick-btn" aria-label="Pick design elevation at start">Pick</button>
            </div>
            <div class="sc-field">
              <input id="scAStart" placeholder="As-built Elev (m)" aria-label="As-built elevation at start" inputmode="decimal" autocomplete="off">
              <button type="button" id="scAStartPick" class="sc-pick-btn" aria-label="Pick as-built elevation at start">Pick</button>
            </div>
          </section>
          <section class="sc-panel" aria-label="End station">
            <div class="sc-panel-head"><svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>End Station</span></div>
            <input id="scEndSta" placeholder="Station (opt.)" aria-label="End station" inputmode="text" autocomplete="off">
            <div class="sc-field">
              <input id="scDEnd" placeholder="Design Elev (m)" aria-label="Design elevation at end" inputmode="decimal" autocomplete="off">
              <button type="button" id="scDEndPick" class="sc-pick-btn" aria-label="Pick design elevation at end">Pick</button>
            </div>
            <div class="sc-field">
              <input id="scAEnd" placeholder="As-built Elev (m)" aria-label="As-built elevation at end" inputmode="decimal" autocomplete="off">
              <button type="button" id="scAEndPick" class="sc-pick-btn" aria-label="Pick as-built elevation at end">Pick</button>
            </div>
          </section>
        </div>
        <label class="sc-len">
          <svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/></svg>
          <input id="scLen" placeholder="Segment Length (m)" aria-label="Segment length in metres" inputmode="decimal" autocomplete="off">
        </label>
        <!-- Filled by app.js; shows a placeholder message (CSS) while empty -->
        <div id="scResults" class="tool-results sc-results" aria-live="polite"></div>
        <div class="tool-actions sc-actions">
          <button type="button" id="scCompute" class="primary"><svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 7h7"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h.01M12 18h.01M15.5 18h.01"/></svg><span>Compute</span></button>
          <button type="button" id="scClear" class="ghost"><svg class="sc-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Clear</span></button>
        </div>
      </div>
      <!-- Slope Calculator (solve 1 unknown) -->
      <div class="tool-card" style="margin-top:12px">
        <div class="tool-title">Slope Calculator (solve 1 unknown)</div>
        <div class="tool-grid">
          <input id="slcStart" placeholder="Bottom Elev (m)" inputmode="decimal" autocomplete="off">
          <input id="slcEnd" placeholder="Top Elev (m)" inputmode="decimal" autocomplete="off">
          <input id="slcSlope" placeholder="Slope (%)" inputmode="decimal" autocomplete="off">
          <input id="slcLen" placeholder="Length (m)" inputmode="decimal" autocomplete="off">
        </div>
        <div id="slcResults" class="tool-results"></div>
        <div class="tool-actions">
          <button type="button" id="slcCompute" class="primary">Compute</button>
          <button type="button" id="slcClear" class="ghost">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Existing BS Picker (bottom sheet) -->
  <div id="bsPickerSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" id="bsPickerBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-labelledby="bsPickerTitle">
      <div class="sheet-header">
        <div id="bsPickerTitle" class="sheet-title">Add Existing BS</div>
        <button type="button" id="bsPickerClose" class="ghost" aria-label="Close">✕</button>
      </div>
      <div id="bsPickerList" class="bs-grid"></div>
    </div>
  </div>

  <!-- Grade Spot Check Sheet (full screen). All IDs unchanged. -->
  <div id="gradeSpotsSheet" class="sheet sheet--full hidden" aria-hidden="true">
    <div class="sheet-backdrop" id="gradeSpotsBackdrop"></div>
    <div class="sheet-panel gs-panel" role="dialog" aria-labelledby="gsTitle">
      <!-- Fixed title bar -->
      <div class="gs-topbar">
        <button type="button" id="gradeSpotsClose" class="gs-back" aria-label="Close grade sheet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </button>
        <div id="gsTitle" class="gs-title">Grade Sheet</div>
      </div>
      <!-- Scrolling content -->
      <div class="gs-scroll">
        <!-- Top of Pipe / Invert inputs: native collapsible, no extra JS.
             Inputs stay in the page while collapsed, so app.js still reads them. -->
        <details class="gs-drops">
          <summary>
            <svg class="gs-drops-icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/></svg>
            <span>Top of Pipe / Invert Inputs</span>
            <svg class="gs-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="gs-drops-grid">
            <div class="gs-field">
              <label for="stormDrop">STM Top→Inv (m)</label>
              <input id="stormDrop" placeholder="e.g. 0.250" inputmode="decimal" autocomplete="off">
            </div>
            <div class="gs-field">
              <label for="sanDrop">SAN Top→Inv (m)</label>
              <input id="sanDrop" placeholder="e.g. 0.250" inputmode="decimal" autocomplete="off">
            </div>
            <div class="gs-field">
              <label for="stormGpsDrop">GPS STM Top→Inv (m)</label>
              <input id="stormGpsDrop" placeholder="e.g. 0.250" inputmode="decimal" autocomplete="off">
            </div>
            <div class="gs-field">
              <label for="sanGpsDrop">GPS SAN Top→Inv (m)</label>
              <input id="sanGpsDrop" placeholder="e.g. 0.250" inputmode="decimal" autocomplete="off">
            </div>
          </div>
        </details>
        <!-- Row actions -->
        <div class="gs-actions">
          <button type="button" id="addGradeRowBtn" class="primary">+ Add Row</button>
          <button type="button" id="clearGradeRowsBtn" class="ghost">Clear</button>
        </div>
        <!-- Rows: one card per row, built by app.js -->
        <div id="gradeSpotsBody" class="gs-list"></div>
      </div>
    </div>
  </div>
  <!-- Slope Checker Picker (from Grade Sheet) -->
  <div id="scPickerSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" id="scPickerBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-labelledby="scPickerTitle">
      <div class="sheet-header">
        <div id="scPickerTitle" class="sheet-title">Pick Elevation</div>
        <button type="button" id="scPickerClose" class="ghost" aria-label="Close">✕</button>
      </div>
      <div id="scPickerList" class="bs-grid"></div>
    </div>
  </div>

  <!-- ASB Elevation Picker (grid) -->
  <div id="asbPickerSheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-backdrop" id="asbPickerBackdrop"></div>
    <div class="sheet-panel" role="dialog" aria-labelledby="asbPickerTitle">
      <div class="sheet-header">
        <div id="asbPickerTitle" class="sheet-title">Pick ASB Elevation</div>
        <button type="button" id="asbPickerClose" class="ghost" aria-label="Close">✕</button>
      </div>
      <div id="asbPickerList" class="bs-grid"></div>
    </div>
  </div>

  <!-- Bump ?v= whenever app.js changes so phones don't load a cached copy -->
  <script src="app.min.js"></script>
  <!-- Bottom bar tap feedback. Separate from app.js: only adds/removes a CSS class,
       never stops the click, so the app's own button handlers run as normal. -->
  <script>
    (function () {
      var bar = document.querySelector('.bottom-nav');
      if (!bar) return;
      var timers = new WeakMap();
      function press(btn) {
        btn.classList.add('is-pressed');
        clearTimeout(timers.get(btn));
        timers.set(btn, setTimeout(function () { btn.classList.remove('is-pressed'); }, 450));
      }
      bar.addEventListener('touchstart', function (e) {
        var btn = e.target.closest('.nav-btn');
        if (btn) btn.classList.add('is-pressed');
      }, { passive: true });
      bar.addEventListener('click', function (e) {
        var btn = e.target.closest('.nav-btn');
        if (btn) press(btn);
      });
    })();
  </script>
</body>
</html>
